name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # creates the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    # Secrets live in this environment; add required reviewers to it for a manual approval gate.
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check tag matches project version
        run: |
          version=$(./gradlew -q :docviewer-core:properties | sed -n 's/^version: //p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
      - run: ./gradlew build publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes are the CHANGELOG section of this version.
          awk -v v="$version" '/^## \[/{found = index($0, "[" v "]") > 0; next} found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" sample/build/outputs/apk/debug/sample-debug.apk \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
